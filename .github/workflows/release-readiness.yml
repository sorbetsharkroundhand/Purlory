name: Release Readiness

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  # MLX 0.32 requires Swift 6.3; pin the image toolchain for CLI and Xcode builds.
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  package:
    name: macOS / Release Candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Toolchain info
        run: |
          uname -m
          swift --version
          xcodebuild -version

      - name: Resolve locked dependencies
        run: |
          scripts/prepare-korean-backend.sh
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Compute metallib cache key
        id: metallib-cache-key
        run: |
          echo "xcode=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Restore MLX metallib cache
        uses: actions/cache@v6
        with:
          path: .build/metallib-cache
          key: mlx-metallib-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.metallib-cache-key.outputs.xcode }}-${{ hashFiles('Package.resolved') }}

      - name: Allow package macros in CI
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build release app bundle
        run: scripts/build-purlory-app.sh

      - name: Validate release app bundle
        run: |
          test -x build/Purlory.app/Contents/MacOS/Purlory
          test -s build/Purlory.app/Contents/MacOS/mlx.metallib
          plutil -lint build/Purlory.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/Purlory.app

      - name: Launch smoke test
        run: scripts/smoke-purlory-app.sh

      - name: Archive release candidate
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Purlory.app build/Purlory.app.zip
          shasum -a 256 build/Purlory.app.zip | tee build/Purlory.app.zip.sha256

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: Purlory-macOS
          path: |
            build/Purlory.app.zip
            build/Purlory.app.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Collect candidate support context
        if: always()
        run: python3 scripts/collect-purlory-support.py --app build/Purlory.app --output build/support-candidate.json --expect-source-revision "$(git rev-parse HEAD)"

      - name: Upload candidate support context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-candidate
          path: build/support-candidate.json
          if-no-files-found: error
          retention-days: 14
